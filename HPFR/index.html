<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本地视频播放器 - t-01.mp4</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .header {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header .tag {
      font-size: 0.75rem;
      background-color: rgba(56, 189, 248, 0.15);
      color: var(--accent-color);
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 500;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      background-color: #000;
      aspect-ratio: 16 / 9;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      outline: none;
      object-fit: contain;
    }

    .footer {
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
      color: var(--text-sub);
    }

    .file-input-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .file-btn {
      background-color: #334155;
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8125rem;
      transition: background-color 0.2s;
    }

    .file-btn:hover {
      background-color: #475569;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-color);"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
        t-01.mp4
      </h1>
      <span class="tag">本地播放</span>
    </div>

    <div class="video-wrapper">
      <video id="mainPlayer" controls autoplay preload="metadata">
        <source src="t-01.mp4" type="video/mp4">
        您的浏览器不支持 HTML5 视频播放。
      </video>
    </div>

    <div class="footer">
      <span>如果无法显示，请确保 HTML 文件与 <code>t-01.mp4</code> 处于同一目录下。</span>
      <div class="file-input-wrapper">
        <label for="localFile" class="file-btn">手动选择文件</label>
        <input type="file" id="localFile" accept="video/mp4,video/*">
      </div>
    </div>
  </div>

  <script>
    // 支持通过文件选择框手动加载任意本地视频文件
    const fileInput = document.getElementById('localFile');
    const player = document.getElementById('mainPlayer');

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        player.src = fileURL;
        player.play();
      }
    });
  </script>

</body>
</html>
