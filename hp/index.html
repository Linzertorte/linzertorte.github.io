<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Harry Potter</title>
  
  <link rel="icon" type="image/png" href="harry.png">
  <link rel="apple-touch-icon" href="harry.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Video.js CSS & JS -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      font-family: serif;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* 顶部 Header */
    header {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #ffffff;
      border-bottom: 1px solid #ccc;
      position: relative;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: bold;
      font-family: serif;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
    }

    .back-btn,
    .logout-btn {
      background: none;
      border: none;
      color: #0000ee;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      padding: 0;
      z-index: 2;
    }

    .back-btn { visibility: hidden; }
    .logout-btn { display: none; }

    /* 视图容器 */
    .view {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }

    .view.active { display: flex; }

    /* Auth 页面 */
    #page-auth { background-color: #ffffff; }

    .auth-card {
      background-color: #ffffff;
      padding: 20px;
      width: 100%;
    }

    .auth-card h2 {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 16px;
      font-family: serif;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-start;
    }

    .form-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
    }

    .form-row label { min-width: 80px; }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
    }

    .auth-link {
      color: #0000ee;
      text-decoration: underline;
      background: none;
      border: none;
      padding: 0;
      font-size: 16px;
      cursor: pointer;
      font-family: serif;
    }

    .auth-msg {
      font-size: 13px;
      color: #d32f2f;
      min-height: 16px;
      font-family: sans-serif;
    }

    /* 菜单页 */
    #page-menu {
      background: #ffffff;
      padding: 20px;
    }

    .link-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .plain-link,
    .plain-link:visited {
      color: #0000ee;
      cursor: pointer;
      width: fit-content;
      text-decoration: underline;
      font-size: 16px;
    }

    /* 视频播放页 */
    #page-video {
      padding: 0;
      background: #000000;
      align-items: center;
      justify-content: center;
      height: 100%;
      position: relative;
    }

    .viewport {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }

    /* Video.js 容器 */
    .video-js {
      width: 100% !important;
      height: 100% !important;
      transform-origin: center center;
    }

    .video-js .vjs-tech {
      pointer-events: none;
    }

    .video-js .vjs-control-bar {
      pointer-events: auto !important;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px)) !important;
      width: 92% !important;
      left: 50% !important;
      transform: translateX(-50%);
      border-radius: 10px;
      background-color: rgba(20, 20, 20, 0.85) !important;
      backdrop-filter: blur(8px);
    }

    .video-js .vjs-fullscreen-control {
      display: none !important;
    }

    .seek-tip {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-family: sans-serif;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 10;
    }
    .seek-tip.left { left: 15%; }
    .seek-tip.right { right: 15%; }
    .seek-tip.show { opacity: 1; }
  </style>
</head>
<body>

  <div id="app">
    <!-- Header -->
    <header>
      <button class="back-btn" id="backBtn" onclick="goBack()">‹ Back</button>
      <h1 id="pageTitle">Harry Potter</h1>
      <button class="logout-btn" id="logoutBtn" onclick="handleLogout()">Exit</button>
    </header>

    <!-- Auth View (默认不再添加 active 类，防止闪屏) -->
    <div id="page-auth" class="view">
      <div class="auth-card">
        <h2 id="authTitle">Login</h2>
        
        <form class="auth-form" onsubmit="return false;">
          <div class="form-row">
            <label for="authUsername">Username:</label>
            <input type="text" id="authUsername" autocomplete="username" />
          </div>

          <div class="form-row">
            <label for="authPassword">Password:</label>
            <input type="password" id="authPassword" autocomplete="current-password" />
          </div>

          <div class="checkbox-row" id="rememberRow">
            <input type="checkbox" id="rememberMe" checked />
            <label for="rememberMe">Remember Me</label>
          </div>

          <button type="button" id="authSubmitBtn" onclick="submitAuth()">Login</button>
          
          <div class="auth-msg" id="authMsg"></div>

          <div>
            <button type="button" class="auth-link" id="authToggleBtn" onclick="toggleAuthMode()">Register</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Dynamic Menu View -->
    <div id="page-menu" class="view">
      <div class="link-list" id="menuList"></div>
    </div>

    <!-- Video Player View -->
    <div id="page-video" class="view">
      <div class="viewport" id="viewport">
        <!-- 提示浮层 -->
        <div id="seekTipLeft" class="seek-tip left">◄◄ -10s</div>
        <div id="seekTipRight" class="seek-tip right">+10s ►►</div>

        <!-- 动态生成 video 标签 -->
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wlncwhtyortyochxlgxs.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_1DYjKoOQBWLfkJ8qz519nA_iPrSPDkj';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                window.location.reload();
              }
            });
          });
        });
      });
    }

    let globalData = null;
    const historyStack = [];
    let isRegisterMode = false;
    let player = null;
    
    const pageTitle = document.getElementById('pageTitle');
    const backBtn = document.getElementById('backBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const menuList = document.getElementById('menuList');
    
    const pageAuth = document.getElementById('page-auth');
    const pageMenu = document.getElementById('page-menu');
    const pageVideo = document.getElementById('page-video');
    const authMsg = document.getElementById('authMsg');

    // 彻底销毁播放器及清空系统 MediaSession
    function destroyPlayer() {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = null;
        navigator.mediaSession.playbackState = 'none';
        const actions = ['play', 'pause', 'seekbackward', 'seekforward', 'previoustrack', 'nexttrack'];
        actions.forEach(action => {
          try { navigator.mediaSession.setActionHandler(action, null); } catch (e) {}
        });
      }

      if (player) {
        try {
          player.pause();
          player.dispose(); // 彻底干掉 Video.js 实例并同步抹除 DOM 节点
        } catch (e) {
          console.warn('Dispose error:', e);
        }
        player = null;
      }
    }

    function createVideoElement() {
      const viewport = document.getElementById('viewport');
      const oldVideo = document.getElementById('mainVideo');
      if (oldVideo) oldVideo.remove();

      const videoEl = document.createElement('video');
      videoEl.id = 'mainVideo';
      videoEl.className = 'video-js vjs-default-skin';
      videoEl.setAttribute('playsinline', 'true');
      videoEl.setAttribute('webkit-playsinline', 'true');
      
      viewport.appendChild(videoEl);

      player = videojs('mainVideo', {
        controls: true,
        autoplay: false,
        preload: 'auto',
        playsinline: true,
        userActions: { click: false, doubleClick: false },
        controlBar: { fullscreenToggle: false },
        html5: {
          vhs: { overrideNative: true },
          nativeAudioTracks: false,
          nativeVideoTracks: false
        }
      });

      player.on('ended', resumeAudioContext);
      player.on('play', resumeAudioContext);
    }

    function updateHeaderState(isLoggedIn) {
      if (isLoggedIn) {
        logoutBtn.style.display = 'inline-block';
      } else {
        logoutBtn.style.display = 'none';
        backBtn.style.visibility = 'hidden';
      }
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      const title = document.getElementById('authTitle');
      const submitBtn = document.getElementById('authSubmitBtn');
      const toggleBtn = document.getElementById('authToggleBtn');
      const rememberRow = document.getElementById('rememberRow');
      
      authMsg.textContent = '';

      if (isRegisterMode) {
        title.textContent = 'Register';
        submitBtn.textContent = 'Register';
        toggleBtn.textContent = 'Login';
        rememberRow.style.display = 'none';
      } else {
        title.textContent = 'Login';
        submitBtn.textContent = 'Login';
        toggleBtn.textContent = 'Register';
        rememberRow.style.display = 'flex';
      }
    }

    function isEmail(str) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(str); }

    function validateInput(inputStr, password) {
      if (password.length < 3) return 'Password must be at least 3 characters.';
      if (/\s/.test(password)) return 'Password cannot contain spaces.';
      if (inputStr.includes('@')) {
        if (!isEmail(inputStr)) return 'Please enter a valid email address.';
      } else {
        if (inputStr.length < 3) return 'Username must be at least 3 characters.';
        if (/\s/.test(inputStr)) return 'Username cannot contain spaces.';
      }
      return null;
    }

    function resolveToEmail(inputStr) {
      if (isEmail(inputStr)) return inputStr.toLowerCase();
      return `${inputStr.toLowerCase()}@app.internal`;
    }

    async function submitAuth() {
      if (isRegisterMode) await handleRegister();
      else await handleLogin();
    }

    async function handleLogin() {
      const inputStr = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value;
      authMsg.style.color = '#d32f2f';
      authMsg.textContent = '';

      const validationError = validateInput(inputStr, password);
      if (validationError) { authMsg.textContent = validationError; return; }

      const email = resolveToEmail(inputStr);
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) authMsg.textContent = error.message;
      else initApp();
    }

    async function handleRegister() {
      const inputStr = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value;
      authMsg.style.color = '#d32f2f';
      authMsg.textContent = '';

      const validationError = validateInput(inputStr, password);
      if (validationError) { authMsg.textContent = validationError; return; }

      const email = resolveToEmail(inputStr);
      const { data, error } = await supabaseClient.auth.signUp({
        email, password, options: { data: { username: inputStr } }
      });

      if (error) authMsg.textContent = error.message;
      else {
        authMsg.style.color = '#2e7d32';
        authMsg.textContent = 'Registration successful! Signing in...';
        setTimeout(handleLogin, 1200);
      }
    }

    async function handleLogout() {
      destroyPlayer();
      historyStack.length = 0;

      try {
        await supabaseClient.auth.signOut();
      } catch (e) {
        console.error('Logout error:', e);
      }

      localStorage.clear();
      updateHeaderState(false);
      showView(pageAuth);
    }

    async function initApp() {
      // 1. 同步预判：通过检查 localStorage 中存有的 Supabase Token，提前展示菜单页，防止未完成接口调用前闪现登录界面
      const hasLocalToken = Object.keys(localStorage).some(key => key.includes('sb-') && key.includes('-auth-token'));
      if (hasLocalToken) {
        showView(pageMenu);
        updateHeaderState(true);
      }

      // 2. 正常异步校验 Supabase Session
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (!session) { 
        updateHeaderState(false); 
        showView(pageAuth); 
        return; 
      }
      
      updateHeaderState(true);
      
      // 保证页面内容正常渲染
      if (!pageMenu.classList.contains('active') || menuList.children.length === 0) {
        await renderLanguages();
      }
    }

    async function loadLocalData() {
      try {
        const res = await fetch('./data.json?t=' + Date.now());
        if (res.ok) globalData = await res.json();
      } catch (err) { console.error('Failed to load data.json:', err); }
    }

    async function logVideoPlay(page) {
      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return;
        let userName = user.user_metadata?.username;
        if (!userName && user.email) {
          userName = user.email.endsWith('@app.internal') ? user.email.replace('@app.internal', '') : user.email;
        }
        const videoId = page.videoSrc ? String(page.videoSrc).slice(-18) : '';
        await supabaseClient.from('video_play_logs').insert([{ 
          user_name: userName || 'Unknown', 
          video_id: videoId, 
          visited_at: new Date().toISOString()
        }]);
      } catch (err) { console.error('Failed to log video play:', err); }
    }

    function resumeAudioContext() {
      if (player) {
        player.muted(false);
        player.volume(1.0);

        if (player.tech_ && player.tech_.el_) {
          const videoEl = player.tech_.el_;
          videoEl.muted = false;
          if (videoEl.volume === 0) videoEl.volume = 1.0;
        }
      }
    }

    async function renderLanguages() {
      pageTitle.textContent = 'Harry Potter';
      backBtn.style.visibility = 'hidden';
      await loadLocalData();
      menuList.innerHTML = '';
      if (!globalData || !globalData.languages) return;

      globalData.languages.forEach((lang, langIndex) => {
        const a = document.createElement('a');
        a.className = 'plain-link';
        a.textContent = lang.title;
        a.onclick = () => { pushHistory(renderLanguages); renderBooks(langIndex); };
        menuList.appendChild(a);
      });
      showView(pageMenu);
    }

    function renderBooks(langIndex) {
      const lang = globalData.languages[langIndex];
      if (!lang) return;
      pageTitle.textContent = lang.headerTitle;
      backBtn.style.visibility = 'visible';
      menuList.innerHTML = '';
      lang.books.forEach((book, bookIndex) => {
        const a = document.createElement('a');
        a.className = 'plain-link';
        a.textContent = book.title;
        a.onclick = () => { pushHistory(() => renderBooks(langIndex)); renderChapters(langIndex, bookIndex); };
        menuList.appendChild(a);
      });
      showView(pageMenu);
    }

    function renderChapters(langIndex, bookIndex) {
      const book = globalData.languages[langIndex]?.books[bookIndex];
      if (!book) return;
      pageTitle.textContent = book.headerTitle;
      backBtn.style.visibility = 'visible';
      menuList.innerHTML = '';
      book.chapters.forEach((chapter, chapterIndex) => {
        const a = document.createElement('a');
        a.className = 'plain-link';
        a.textContent = chapter.title;
        a.onclick = () => { pushHistory(() => renderChapters(langIndex, bookIndex)); renderPages(langIndex, bookIndex, chapterIndex); };
        menuList.appendChild(a);
      });
      showView(pageMenu);
    }

    function renderPages(langIndex, bookIndex, chapterIndex) {
      const chapter = globalData.languages[langIndex]?.books[bookIndex]?.chapters[chapterIndex];
      if (!chapter) return;
      pageTitle.textContent = chapter.headerTitle;
      backBtn.style.visibility = 'visible';
      menuList.innerHTML = '';
      chapter.pages.forEach((page) => {
        const a = document.createElement('a');
        a.className = 'plain-link';
        a.textContent = page.title;
        a.onclick = () => { pushHistory(() => renderPages(langIndex, bookIndex, chapterIndex)); playVideo(page); };
        menuList.appendChild(a);
      });
      showView(pageMenu);
    }

    function playVideo(page) {
      logVideoPlay(page);
      pageTitle.textContent = page.title;
      backBtn.style.visibility = 'visible';
      showView(pageVideo);

      destroyPlayer();
      createVideoElement();

      player.src({ src: page.videoSrc, type: 'video/mp4' });
      if (page.poster) player.poster(page.poster);

      player.currentTime(0);
      resumeAudioContext();

      const playPromise = player.play();
      if (playPromise !== undefined) {
        playPromise.catch((err) => {
          console.warn('带声自动播放被拒绝，尝试静音启动:', err);
          player.muted(true);
          player.play().catch(() => {});
        });
      }

      resetZoom();
    }

    function showView(targetView) {
      pageAuth.classList.remove('active');
      pageMenu.classList.remove('active');
      pageVideo.classList.remove('active');
      targetView.classList.add('active');
    }

    function pushHistory(renderFn) { historyStack.push(renderFn); }

    async function goBack() {
      if (historyStack.length === 0) return;
      
      if (pageVideo.classList.contains('active')) {
        destroyPlayer();
      }
      
      const previousRender = historyStack.pop();
      await previousRender();
    }

    // ==========================================
    // Zoom & Pan + 双击快进/快退 (忽略单击)
    // ==========================================
    const viewport = document.getElementById('viewport');
    let scale = 1, translateX = 0, translateY = 0;
    const minScale = 1, maxScale = 5;

    function updateTransform() {
      const videoEl = document.querySelector('.video-js');
      if (!videoEl) return;
      if (scale === 1) { translateX = 0; translateY = 0; } 
      else {
        const rect = viewport.getBoundingClientRect();
        const maxTx = (rect.width * (scale - 1)) / 2;
        const maxTy = (rect.height * (scale - 1)) / 2;
        translateX = Math.min(Math.max(translateX, -maxTx), maxTx);
        translateY = Math.min(Math.max(translateY, -maxTy), maxTy);
      }
      videoEl.style.transform = `translate(${translateX}px) translate(${translateY}px) scale(${scale})`;
    }

    function setZoom(newScale) { scale = Math.min(Math.max(newScale, minScale), maxScale); updateTransform(); }
    function resetZoom() { scale = 1; translateX = 0; translateY = 0; updateTransform(); }

    viewport.addEventListener('wheel', (e) => { e.preventDefault(); setZoom(scale + (e.deltaY < 0 ? 0.2 : -0.2)); }, { passive: false });

    let isDragging = false, startX = 0, startY = 0;
    let hasMoved = false;
    
    function onDragStart(x, y) { 
      hasMoved = false;
      if (scale > 1) { 
        isDragging = true; 
        startX = x - translateX; 
        startY = y - translateY; 
      } 
    }

    function onDragMove(x, y) { 
      if (isDragging) { 
        if (Math.abs(x - (startX + translateX)) > 5 || Math.abs(y - (startY + translateY)) > 5) {
          hasMoved = true;
        }
        translateX = x - startX; 
        translateY = y - startY; 
        updateTransform(); 
      } 
    }

    function onDragEnd() { isDragging = false; }

    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.vjs-control-bar')) return;
      onDragStart(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', (e) => onDragMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', onDragEnd);

    viewport.addEventListener('dblclick', (e) => {
      if (e.target.closest('.vjs-control-bar')) return;
      handleDoubleTapSeek(e.clientX);
    });

    let initialPinchDist = null, initialScale = 1;
    let lastTapTime = 0, lastTapX = 0;

    function getDistance(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }

    viewport.addEventListener('touchstart', (e) => {
      if (e.target.closest('.vjs-control-bar')) return;
      if (e.touches.length === 1) {
        onDragStart(e.touches[0].clientX, e.touches[0].clientY);
      } else if (e.touches.length === 2) { 
        isDragging = false; 
        hasMoved = true; 
        initialPinchDist = getDistance(e.touches); 
        initialScale = scale; 
      }
    }, { passive: true });

    viewport.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) {
        onDragMove(e.touches[0].clientX, e.touches[0].clientY);
      } else if (e.touches.length === 2 && initialPinchDist) {
        setZoom(initialScale * (getDistance(e.touches) / initialPinchDist));
      }
    }, { passive: true });

    viewport.addEventListener('touchend', (e) => {
      if (e.target.closest('.vjs-control-bar')) return;

      if (hasMoved || initialPinchDist !== null) {
        hasMoved = false;
        if (e.touches.length < 2) initialPinchDist = null;
        if (e.touches.length === 0) onDragEnd();
        return;
      }

      if (e.changedTouches.length !== 1) return;

      const now = Date.now();
      const touch = e.changedTouches[0];
      const timeDiff = now - lastTapTime;
      const distDiff = Math.abs(touch.clientX - lastTapX);

      if (timeDiff < 300 && timeDiff > 0 && distDiff < 30) {
        handleDoubleTapSeek(touch.clientX);
        lastTapTime = 0;
      } else {
        lastTapTime = now;
        lastTapX = touch.clientX;
      }

      if (e.touches.length === 0) onDragEnd();
    });

    const seekTipLeft = document.getElementById('seekTipLeft');
    const seekTipRight = document.getElementById('seekTipRight');
    let seekTipTimer = null;

    function showSeekTip(direction) {
      clearTimeout(seekTipTimer);
      seekTipLeft.classList.remove('show');
      seekTipRight.classList.remove('show');

      const targetTip = direction === 'left' ? seekTipLeft : seekTipRight;
      targetTip.classList.add('show');

      seekTipTimer = setTimeout(() => { targetTip.classList.remove('show'); }, 600);
    }

    function handleDoubleTapSeek(clientX) {
      if (!player) return;
      resumeAudioContext();
      const rect = viewport.getBoundingClientRect();
      const clickX = clientX - rect.left;
      const currTime = player.currentTime();
      const duration = player.duration();

      if (clickX < rect.width / 2) {
        player.currentTime(Math.max(0, currTime - 10));
        showSeekTip('left');
      } else {
        player.currentTime(Math.min(duration || 0, currTime + 10));
        showSeekTip('right');
      }
    }

    function unlockAudioContext() {
      resumeAudioContext();
      document.removeEventListener('touchstart', unlockAudioContext);
      document.removeEventListener('click', unlockAudioContext);
    }
    document.addEventListener('touchstart', unlockAudioContext, { once: true });
    document.addEventListener('click', unlockAudioContext, { once: true });

    window.addEventListener('load', initApp);

    // 页面完全卸载/关闭时防护
    window.addEventListener('beforeunload', () => {
      destroyPlayer();
    });

    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        if (pageVideo.classList.contains('active') && player) {
          resumeAudioContext();
          if (!player.paused()) {
            player.play().catch(() => {});
          }
        } else if (pageMenu.classList.contains('active') && historyStack.length === 0) {
          await renderLanguages();
        }
      }
    });
  </script>
</body>
</html>
