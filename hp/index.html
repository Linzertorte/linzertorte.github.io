<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Harry Potter Audible</title>
  
  <!-- Icon & PWA Flags -->
  <link rel="icon" type="image/png" href="harry.png">
  <link rel="apple-touch-icon" href="harry.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Harry Potter">

  <!-- 引入 Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* 全局页面背景：浅灰，与截图保持一致 */
    html, body {
      width: 100%;
      height: 100%;
      background-color: #e5e5e5;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Times New Roman", Times, serif;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* 顶部 Header */
    header {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #ffffff;
      border-bottom: 1px solid #ccc;
      z-index: 10;
      flex-shrink: 0;
      position: relative;
    }

    .back-btn,
    .logout-btn {
      background: transparent !important;
      border: none !important;
      outline: none !important;
      color: #0000ee;
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      display: inline-block;
      text-decoration: underline !important;
      z-index: 2;
    }

    .back-btn { visibility: hidden; }
    .logout-btn { display: none; }

    header h1 {
      font-size: 16px;
      font-weight: bold;
      color: #000000;
      font-family: serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 视图通用容器 */
    .view {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }

    .view.active { display: flex; }

    /* ==========================================
       复古极简 Auth UI (严格匹配截图)
       ========================================== */
    #page-auth {
      background-color: #e5e5e5;
      padding: 0;
    }

    .auth-card {
      background-color: #ffffff;
      padding: 24px 20px 30px 20px;
      width: 100%;
      box-sizing: border-box;
    }

    .auth-card h2 {
      font-family: "Times New Roman", Times, serif;
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #000000;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 输入框行布局 */
    .form-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-row label {
      font-size: 15px;
      color: #000000;
      min-width: 78px;
      text-align: left;
    }

    .form-row input[type="text"],
    .form-row input[type="password"],
    .form-row input[type="email"] {
      flex: 1;
      max-width: 200px;
      height: 28px;
      padding: 0 8px;
      border: 1px solid #a6a6a6;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      background-color: #fff;
      color: #000;
      font-family: sans-serif;
    }

    /* Remember Me 复选框行 */
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
      font-size: 15px;
      color: #000;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid #888;
    }

    /* 蓝色 Oval / Pill 按钮 */
    .auth-submit-btn {
      align-self: flex-start;
      margin-top: 4px;
      background-color: #007aff;
      color: #ffffff;
      border: none;
      padding: 6px 18px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .auth-submit-btn:active {
      background-color: #0056b3;
    }

    /* 底部蓝色下划线切换链接 */
    .auth-switch-link {
      margin-top: 16px;
      display: inline-block;
      color: #0000ee;
      font-size: 15px;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      text-align: left;
    }

    .auth-msg {
      font-size: 12px;
      color: #d32f2f;
      margin-top: 4px;
      min-height: 16px;
      font-family: sans-serif;
    }

    /* Menu View Styles */
    #page-menu {
      background: #ffffff;
      padding: 20px;
    }

    .link-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .plain-link,
    .plain-link:visited {
      color: #0000ee;
      cursor: pointer;
      width: fit-content;
      text-decoration: underline !important;
      font-size: 16px;
    }

    .plain-link:visited { color: #551a8b; }
    .plain-link:active { color: #ff0000; }

    /* Video View Styles */
    #page-video {
      padding: 0;
      background: #000000;
      position: relative;
      align-items: center;
      justify-content: center;
    }

    .viewport {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
      cursor: grab;
    }

    .viewport:active { cursor: grabbing; }

    video {
      max-width: 100%;
      max-height: 100%;
      transform-origin: center center;
      will-change: transform;
      outline: none;
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- Header -->
    <header>
      <button class="back-btn" id="backBtn" onclick="goBack()">‹ Back</button>
      <h1 id="pageTitle">Harry Potter</h1>
      <button class="logout-btn" id="logoutBtn" onclick="handleLogout()">Exit</button>
    </header>

    <!-- Auth View (严格匹配截图 UI) -->
    <div id="page-auth" class="view active">
      <div class="auth-card">
        <h2 id="authTitle">Login</h2>
        
        <form class="auth-form" onsubmit="return false;">
          <div class="form-row">
            <label for="authEmail">Username:</label>
            <input type="email" id="authEmail" autocomplete="username" />
          </div>

          <div class="form-row">
            <label for="authPassword">Password:</label>
            <input type="password" id="authPassword" autocomplete="current-password" />
          </div>

          <div class="checkbox-row" id="rememberRow">
            <input type="checkbox" id="rememberMe" checked />
            <label for="rememberMe">Remember Me</label>
          </div>

          <button type="button" class="auth-submit-btn" id="authSubmitBtn" onclick="submitAuth()">Login</button>
          
          <div class="auth-msg" id="authMsg"></div>

          <div>
            <button type="button" class="auth-switch-link" id="authToggleBtn" onclick="toggleAuthMode()">Register</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Dynamic Menu View -->
    <div id="page-menu" class="view">
      <div class="link-list" id="menuList"></div>
    </div>

    <!-- Video Player View -->
    <div id="page-video" class="view">
      <div class="viewport" id="viewport">
        <video id="mainVideo" controls playsinline webkit-playsinline preload="auto"></video>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 初始化 Supabase 客户端配置
    // ==========================================
    const SUPABASE_URL = 'https://wlncwhtyortyochxlgxs.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_1DYjKoOQBWLfkJ8qz519nA_iPrSPDkj';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            console.log('ServiceWorker registered:', reg.scope);
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  window.location.reload();
                }
              });
            });
          })
          .catch(err => console.log('ServiceWorker registration failed:', err));
      });
    }

    let globalData = null;
    const historyStack = [];
    let isRegisterMode = false;
    
    const pageTitle = document.getElementById('pageTitle');
    const backBtn = document.getElementById('backBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const menuList = document.getElementById('menuList');
    
    const pageAuth = document.getElementById('page-auth');
    const pageMenu = document.getElementById('page-menu');
    const pageVideo = document.getElementById('page-video');
    const authMsg = document.getElementById('authMsg');

    // 统一控制 Header 登录/未登录显示状态
    function updateHeaderState(isLoggedIn) {
      if (isLoggedIn) {
        logoutBtn.style.display = 'inline-block';
      } else {
        logoutBtn.style.display = 'none';
        backBtn.style.visibility = 'hidden';
      }
    }

    // ==========================================
    // 2. Auth 模式切换与登录逻辑
    // ==========================================
    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      
      const title = document.getElementById('authTitle');
      const submitBtn = document.getElementById('authSubmitBtn');
      const toggleBtn = document.getElementById('authToggleBtn');
      const rememberRow = document.getElementById('rememberRow');
      
      authMsg.textContent = '';

      if (isRegisterMode) {
        title.textContent = 'Register';
        submitBtn.textContent = 'Register';
        toggleBtn.textContent = 'Login';
        rememberRow.style.display = 'none';
      } else {
        title.textContent = 'Login';
        submitBtn.textContent = 'Login';
        toggleBtn.textContent = 'Register';
        rememberRow.style.display = 'flex';
      }
    }

    async function submitAuth() {
      if (isRegisterMode) {
        await handleRegister();
      } else {
        await handleLogin();
      }
    }

    async function handleLogin() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      authMsg.style.color = '#d32f2f';
      authMsg.textContent = '';

      if (!email || !password) {
        authMsg.textContent = 'Please enter email and password.';
        return;
      }

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        authMsg.textContent = error.message;
      } else {
        initApp();
      }
    }

    async function handleRegister() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      authMsg.style.color = '#d32f2f';
      authMsg.textContent = '';

      if (!email || !password) {
        authMsg.textContent = 'Please enter email and password.';
        return;
      }

      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) {
        authMsg.textContent = error.message;
      } else {
        authMsg.style.color = '#2e7d32';
        authMsg.textContent = 'Registration successful! Signing in...';
        setTimeout(handleLogin, 1200);
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      localStorage.clear();
      updateHeaderState(false);
      showView(pageAuth);
    }

    // ==========================================
    // 3. 应用入口 & 本地静态 data.json 加载
    // ==========================================
    async function initApp() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (!session) {
        updateHeaderState(false);
        showView(pageAuth);
        return;
      }

      updateHeaderState(true);
      await renderLanguages();
    }

    async function loadLocalData() {
      try {
        const res = await fetch('./data.json?t=' + Date.now());
        if (res.ok) {
          globalData = await res.json();
        }
      } catch (err) {
        console.error('Failed to load data.json:', err);
      }
    }

    // ==========================================
    // 4. 用户播放行为日志记录
    // ==========================================
    async function logVideoPlay(page) {
      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return;

        await supabaseClient.from('video_play_logs').insert([
          {
            video_id: page.videoSrc,
            video_title: page.title
          }
        ]);
      } catch (err) {
        console.error('Log exception:', err);
      }
    }

    // ==========================================
    // 5. 菜单渲染与播放器控制
    // ==========================================
    function recoverAudio() {
      const video = document.getElementById('mainVideo');
      if (!video) return;
      video.muted = false;
      video.volume = 1.0;
      
      if (video.paused && video.currentTime > 0) {
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.then(() => { video.muted = false; }).catch(() => {});
        }
      }
    }

    document.addEventListener('fullscreenchange', handleFullscreenChange);
    document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

    function handleFullscreenChange() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
      if (!isFullscreen) recoverAudio();
    }

    async function renderLanguages() {
      pageTitle.textContent = 'Harry Potter';
      backBtn.style.visibility = 'hidden';

      await loadLocalData();

      menuList.innerHTML = '';
      if (!globalData || !globalData.languages) return;

      globalData.languages.forEach((lang, langIndex) => {
        const a = document.createElement('a');
        a.className = 'plain-link';
        a.textContent = lang.title;
        a.onclick = () => {
          pushHistory(renderLanguages);
          renderBooks(langIndex);
        };
        menuList.appendChild(a);
      });

      showView(pageMenu);
    }

    function renderBooks(langIndex) {
      const lang = globalData.languages[langIndex];
      if (!lang) return;

      pageTitle.textContent = lang.headerTitle;
      backBtn.style.visibility = 'visible';

      menuList.innerHTML = '';
      lang.books.forEach((book, bookIndex) => {
        const a = document.createElement('a');
        a.className = 'plain-link';
        a.textContent = book.title;
        a.onclick = () => {
          pushHistory(() => renderBooks(langIndex));
          renderChapters(langIndex, bookIndex);
        };
        menuList.appendChild(a);
      });

      showView(pageMenu);
    }

    function renderChapters(langIndex, bookIndex) {
      const book = globalData.languages[langIndex]?.books[bookIndex];
      if (!book) return;

      pageTitle.textContent = book.headerTitle;
      backBtn.style.visibility = 'visible';

      menuList.innerHTML = '';
      book.chapters.forEach((chapter, chapterIndex) => {
        const a = document.createElement('a');
        a.className = 'plain-link';
        a.textContent = chapter.title;
        a.onclick = () => {
          pushHistory(() => renderChapters(langIndex, bookIndex));
          renderPages(langIndex, bookIndex, chapterIndex);
        };
        menuList.appendChild(a);
      });

      showView(pageMenu);
    }

    function renderPages(langIndex, bookIndex, chapterIndex) {
      const chapter = globalData.languages[langIndex]?.books[bookIndex]?.chapters[chapterIndex];
      if (!chapter) return;

      pageTitle.textContent = chapter.headerTitle;
      backBtn.style.visibility = 'visible';

      menuList.innerHTML = '';
      chapter.pages.forEach((page) => {
        const a = document.createElement('a');
        a.className = 'plain-link';
        a.textContent = page.title;
        a.onclick = () => {
          pushHistory(() => renderPages(langIndex, bookIndex, chapterIndex));
          playVideo(page);
        };
        menuList.appendChild(a);
      });

      showView(pageMenu);
    }

    function playVideo(page) {
      logVideoPlay(page);

      pageTitle.textContent = page.title;
      backBtn.style.visibility = 'visible';

      showView(pageVideo);

      const viewport = document.getElementById('viewport');
      let oldVideo = document.getElementById('mainVideo');

      if (oldVideo) {
        oldVideo.pause();
        oldVideo.removeAttribute('src');
        oldVideo.load();
        viewport.removeChild(oldVideo);
      }

      const newVideo = document.createElement('video');
      newVideo.id = 'mainVideo';
      newVideo.controls = true;
      newVideo.playsInline = true;
      newVideo.setAttribute('webkit-playsinline', 'true');
      newVideo.preload = 'auto';
      
      if (page.poster) newVideo.poster = page.poster;
      newVideo.src = page.videoSrc;

      newVideo.muted = true;
      const playPromise = newVideo.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          newVideo.pause();
          newVideo.currentTime = 0;
          newVideo.muted = false;
        }).catch(() => {
          newVideo.muted = false;
        });
      }

      newVideo.addEventListener('error', recoverAudio);
      newVideo.addEventListener('webkitendfullscreen', recoverAudio);
      newVideo.addEventListener('ended', () => {
        newVideo.currentTime = 0;
        recoverAudio();
      });

      viewport.appendChild(newVideo);
      resetZoom();
    }

    function showView(targetView) {
      pageAuth.classList.remove('active');
      pageMenu.classList.remove('active');
      pageVideo.classList.remove('active');
      targetView.classList.add('active');
    }

    function pushHistory(renderFn) {
      historyStack.push(renderFn);
    }

    async function goBack() {
      if (historyStack.length === 0) return;

      if (pageVideo.classList.contains('active')) {
        const video = document.getElementById('mainVideo');
        if (video) {
          video.pause();
          video.removeAttribute('src');
          video.load();
        }
      }

      const previousRender = historyStack.pop();
      await previousRender();
    }

    // ==========================================
    // 6. 手势缩放与拖拽逻辑 (Zoom & Pan)
    // ==========================================
    const viewport = document.getElementById('viewport');
    let scale = 1, translateX = 0, translateY = 0;
    const minScale = 1, maxScale = 5;

    function updateTransform() {
      const video = document.getElementById('mainVideo');
      if (!video) return;
      if (scale === 1) { translateX = 0; translateY = 0; } 
      else {
        const rect = viewport.getBoundingClientRect();
        const maxTx = (rect.width * (scale - 1)) / 2;
        const maxTy = (rect.height * (scale - 1)) / 2;
        translateX = Math.min(Math.max(translateX, -maxTx), maxTx);
        translateY = Math.min(Math.max(translateY, -maxTy), maxTy);
      }
      video.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    function setZoom(newScale) { scale = Math.min(Math.max(newScale, minScale), maxScale); updateTransform(); }
    function resetZoom() { scale = 1; translateX = 0; translateY = 0; updateTransform(); }

    viewport.addEventListener('wheel', (e) => { e.preventDefault(); setZoom(scale + (e.deltaY < 0 ? 0.2 : -0.2)); }, { passive: false });

    let isDragging = false, startX = 0, startY = 0;
    function onDragStart(x, y) { if (scale > 1) { isDragging = true; startX = x - translateX; startY = y - translateY; } }
    function onDragMove(x, y) { if (isDragging) { translateX = x - startX; translateY = y - startY; updateTransform(); } }
    function onDragEnd() { isDragging = false; }

    viewport.addEventListener('mousedown', (e) => {
      const video = document.getElementById('mainVideo');
      if (e.target === video && e.clientY > window.innerHeight - 60) return;
      onDragStart(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', (e) => onDragMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', onDragEnd);

    let initialPinchDist = null, initialScale = 1;
    function getDistance(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }

    viewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) onDragStart(e.touches[0].clientX, e.touches[0].clientY);
      else if (e.touches.length === 2) { isDragging = false; initialPinchDist = getDistance(e.touches); initialScale = scale; }
    }, { passive: true });

    viewport.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) onDragMove(e.touches[0].clientX, e.touches[0].clientY);
      else if (e.touches.length === 2 && initialPinchDist) setZoom(initialScale * (getDistance(e.touches) / initialPinchDist));
    }, { passive: true });

    viewport.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDist = null;
      if (e.touches.length === 0) onDragEnd();
    });

    window.addEventListener('load', initApp);

    // ==========================================
    // 7. 页面前后台切换控制
    // ==========================================
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        if (pageVideo.classList.contains('active')) {
          recoverAudio();
          return;
        }

        const isAtHomepage = pageMenu.classList.contains('active') && historyStack.length === 0;
        if (isAtHomepage) {
          await renderLanguages();
        }
      }
    });
  </script>
</body>
</html>
