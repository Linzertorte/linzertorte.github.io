<html>
   <head>
      <title>Assimil Arabic</title>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
      <link rel="stylesheet" href="bootstrap.min.css">
      <script src="jquery.min.js"></script>
      <script src="popper.min.js"></script>
      <script src="bootstrap.min.js"></script>
      <script src="howler.core.min.js"></script>
      <script src="howler.min.js"></script>
      <style>
         body {
            padding-top: 2em;
            background-color: #F8F8F8;
         }
         table {
           table-layout: fixed;
           word-wrap: break-word;
         }
         tr {
            background-color: white;
         }
         td {
            word-break: break-all;
         }
      </style>
   </head>
   <body>
      <div class="container">
         <h3>Lesson 6</h3>
         <table class="table">
            <tbody>
               <tr onclick="m('N6')">
                  <td>N6</td>
               </tr>
               <tr onclick="m('S00-TITLE')">
                  <td>S00-TITLE</td>
               </tr>
               <tr onclick="m('S01')">
                  <td>S01</td>
               </tr>
               <tr onclick="m('S02')">
                  <td>S02</td>
               </tr>
               <tr onclick="m('S03')">
                  <td>S03</td>
               </tr>
               <tr onclick="m('S04')">
                  <td>S04</td>
               </tr>
               <tr onclick="m('T00-TRANSLATE')">
                  <td>T00-TRANSLATE</td>
               </tr>
               <tr onclick="m('T01')">
                  <td>T01</td>
               </tr>
               <tr onclick="m('T02')">
                  <td>T02</td>
               </tr>
               <tr onclick="m('T03')">
                  <td>T03</td>
               </tr>
               <tr onclick="m('T04')">
                  <td>T04</td>
               </tr>
            </tbody>
         </table>
      </div>
   </body>
   <script>
      var sound = new Howl(
        {
          "src": [
            "ar_006.mp3"
          ],
          "sprite": {
            "N6": [
              0,
              4069
            ],
            "S00-TITLE": [
              5000,
              3501
            ],
            "S01": [
              9000,
              5467
            ],
            "S02": [
              15000,
              4902
            ],
            "S03": [
              20000,
              4627
            ],
            "S04": [
              25000,
              7293
            ],
            "T00-TRANSLATE": [
              33000,
              3046
            ],
            "T01": [
              37000,
              5423
            ],
            "T02": [
              43000,
              5316
            ],
            "T03": [
              49000,
              6146
            ],
            "T04": [
              56000,
              8701
            ]
          }
        }
      );
      function m(p){
        sound.play(p);
      }
      $('table tr').each(function(a,b){
        $(b).click(function(){
          $('table tr').css('background','white');
          $(this).css('background','#E8E8E8');
        });
      });
   </script>
</html>
