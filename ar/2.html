<html>
   <head>
      <title>Assimil Arabic</title>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
      <link rel="stylesheet" href="bootstrap.min.css">
      <script src="jquery.min.js"></script>
      <script src="popper.min.js"></script>
      <script src="bootstrap.min.js"></script>
      <script src="howler.core.min.js"></script>
      <script src="howler.min.js"></script>
      <style>
         body {
            padding-top: 2em;
            background-color: #F8F8F8;
         }
         table {
           table-layout: fixed;
           word-wrap: break-word;
         }
         tr {
            background-color: white;
         }
         td {
            word-break: break-all;
         }
      </style>
   </head>
   <body>
      <div class="container">
         <h3>Lesson 2</h3>
         <table class="table">
            <tbody>
               <tr onclick="m('N2')">
                  <td>N2</td>
               </tr>
               <tr onclick="m('S00-TITLE')">
                  <td>S00-TITLE</td>
               </tr>
               <tr onclick="m('S01')">
                  <td>S01</td>
               </tr>
               <tr onclick="m('S02')">
                  <td>S02</td>
               </tr>
               <tr onclick="m('T00-TRANSLATE')">
                  <td>T00-TRANSLATE</td>
               </tr>
               <tr onclick="m('T01')">
                  <td>T01</td>
               </tr>
               <tr onclick="m('T02')">
                  <td>T02</td>
               </tr>
            </tbody>
         </table>
      </div>
   </body>
   <script>
      var sound = new Howl(
        {
          "src": [
            "ar_002.mp3"
          ],
          "sprite": {
            "N2": [
              0,
              4235
            ],
            "S00-TITLE": [
              5000,
              4040
            ],
            "S01": [
              10000,
              5196
            ],
            "S02": [
              16000,
              5172
            ],
            "T00-TRANSLATE": [
              22000,
              3295
            ],
            "T01": [
              26000,
              4972
            ],
            "T02": [
              31000,
              6283
            ]
          }
        }
      );
      function m(p){
        sound.play(p);
      }
      $('table tr').each(function(a,b){
        $(b).click(function(){
          $('table tr').css('background','white');
          $(this).css('background','#E8E8E8');
        });
      });
   </script>
</html>
