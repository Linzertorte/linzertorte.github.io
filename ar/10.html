<html>

      <link rel="stylesheet" href="bootstrap.min.css">
      <script src="jquery.min.js"></script>
      <script src="popper.min.js"></script>
      <script src="bootstrap.min.js"></script>
      <script src="howler.core.min.js"></script>
      <script src="howler.min.js"></script>
      <style>
         body {
            padding-top: 2em;
            background-color: #F8F8F8;
         }
         table {
           table-layout: fixed;
           word-wrap: break-word;
         }
         tr {
            background-color: white;
         }
         td {
            word-break: break-all;
         }
      </style>
   </head>
   <body>
      <div class="container">
         <h3>Lesson 10</h3>
         <table class="table">
            <tbody>
               <tr onclick="m('N10')">
                  <td>N10</td>
               </tr>
               <tr onclick="m('S00-TITLE')">
                  <td>S00-TITLE</td>
               </tr>
               <tr onclick="m('S01')">
                  <td>S01</td>
               </tr>
               <tr onclick="m('S02')">
                  <td>S02</td>
               </tr>
               <tr onclick="m('S03')">
                  <td>S03</td>
               </tr>
               <tr onclick="m('S04')">
                  <td>S04</td>
               </tr>
               <tr onclick="m('T00-TRANSLATE')">
                  <td>T00-TRANSLATE</td>
               </tr>
               <tr onclick="m('T01')">
                  <td>T01</td>
               </tr>
               <tr onclick="m('T02')">
                  <td>T02</td>
               </tr>
               <tr onclick="m('T03')">
                  <td>T03</td>
               </tr>
               <tr onclick="m('T04')">
                  <td>T04</td>
               </tr>
               <tr onclick="m('T05')">
                  <td>T05</td>
               </tr>
            </tbody>
         </table>
      </div>
   </body>
   <script>
      var sound = new Howl(
        {
          "src": [
            "ar_010.mp3"
          ],
          "sprite": {
            "N10": [
              0,
              4395
            ],
            "S00-TITLE": [
              5000,
              3550
            ],
            "S01": [
              9000,
              5689
            ],
            "S02": [
              15000,
              4537
            ],
            "S03": [
              20000,
              4670
            ],
            "S04": [
              25000,
              5898
            ],
            "T00-TRANSLATE": [
              31000,
              2967
            ],
            "T01": [
              34000,
              8007
            ],
            "T02": [
              43000,
              6190
            ],
            "T03": [
              50000,
              7075
            ],
            "T04": [
              58000,
              6378
            ],
            "T05": [
              65000,
              4705
            ]
          }
        }
      );
      function m(p){
        sound.play(p);
      }
      $('table tr').each(function(a,b){
        $(b).click(function(){
          $('table tr').css('background','white');
          $(this).css('background','#E8E8E8');
        });
      });
   </script>
</html>
