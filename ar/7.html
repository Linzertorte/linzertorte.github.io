<html>
   <head>
      <title>Assimil Arabic</title>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
      <link rel="stylesheet" href="bootstrap.min.css">
      <script src="jquery.min.js"></script>
      <script src="popper.min.js"></script>
      <script src="bootstrap.min.js"></script>
      <script src="howler.core.min.js"></script>
      <script src="howler.min.js"></script>
      <style>
         body {
            padding-top: 2em;
            background-color: #F8F8F8;
         }
         table {
           table-layout: fixed;
           word-wrap: break-word;
         }
         tr {
            background-color: white;
         }
         td {
            word-break: break-all;
         }
      </style>
   </head>
   <body>
      <div class="container">
         <h3>Lesson 7</h3>
         <table class="table">
            <tbody>
               <tr onclick="m('N7')">
                  <td>N7</td>
               </tr>
               <tr onclick="m('S00-TITLE')">
                  <td>S00-TITLE</td>
               </tr>
               <tr onclick="m('S01')">
                  <td>S01</td>
               </tr>
               <tr onclick="m('S02')">
                  <td>S02</td>
               </tr>
               <tr onclick="m('S03')">
                  <td>S03</td>
               </tr>
               <tr onclick="m('S04')">
                  <td>S04</td>
               </tr>
            </tbody>
         </table>
      </div>
   </body>
   <script>
      var sound = new Howl(
        {
          "src": [
            "ar_007.mp3"
          ],
          "sprite": {
            "N7": [
              0,
              4371
            ],
            "S00-TITLE": [
              5000,
              5297
            ],
            "S01": [
              11000,
              6155
            ],
            "S02": [
              18000,
              7647
            ],
            "S03": [
              26000,
              6464
            ],
            "S04": [
              33000,
              6541
            ]
          }
        }
      );
      function m(p){
        sound.play(p);
      }
      $('table tr').each(function(a,b){
        $(b).click(function(){
          $('table tr').css('background','white');
          $(this).css('background','#E8E8E8');
        });
      });
   </script>
</html>
